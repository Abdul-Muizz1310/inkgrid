name: Release

# A version tag publishes to PyPI with the repository's API token, as feathers and
# slowquery-detective publish; a testpypi-v tag rehearses the same build on TestPyPI with its own
# token (docs/specs/17-release.md). Each token is read only by its own environment's job.
on:
  push:
    tags: ["v*", "testpypi-v*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check, test, and build once
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked --all-groups
      - name: Refuse a tag that must not publish
        env:
          TAG: "${{ github.ref_name }}"
        run: uv run python scripts/check_release.py "${TAG#testpypi-}"
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python scripts/check_coverage_floors.py
      - name: Build, then check wheel metadata and smoke-test wheel and sdist in isolated envs
        run: uv run pytest -m slow --no-cov
      - run: uv build --no-sources
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    if: startsWith(github.ref, 'refs/tags/testpypi-v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/inkgrid
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
      - name: Upload, skipping files TestPyPI already has
        env:
          UV_PUBLISH_TOKEN: "${{ secrets.TEST_PYPI_API_TOKEN }}"
        run: >-
          uv publish --trusted-publishing never --publish-url https://test.pypi.org/legacy/
          --check-url https://test.pypi.org/simple/ dist/*

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/inkgrid
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
      - name: Upload, skipping files PyPI already has (a rerun after a partial upload)
        env:
          UV_PUBLISH_TOKEN: "${{ secrets.PYPI_API_TOKEN }}"
        run: uv publish --trusted-publishing never --check-url https://pypi.org/simple/ dist/*
