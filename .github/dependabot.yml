version: 2
updates:
  # Actions are pinned by commit SHA (setup-uv has no floating major tag), so bump them here.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore

  # Python dependencies resolved from pyproject.toml into uv.lock; CI syncs with --locked.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
