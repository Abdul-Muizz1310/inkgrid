# Every dataset, scorer, and tool the benchmark uses, pinned (docs/specs/12-benchmark.md section 1).
# Files are fetched into ~/.cache/inkgrid-bench/ by inkgrid_bench.fetch and never committed.

[source.icdar2013-competition]
url = "https://www.tamirhassan.com/html/files/icdar2013-competition-dataset-with-gt.zip"
sha256 = "3c005732f5f829a0c1f5c50bf92cd13cbe935e5ad717a0631ca8d7a04b0e01e9"
file = "icdar2013/competition-with-gt.zip"

[source.icdar2013-practice-eu]
url = "https://www.tamirhassan.com/html/files/eu-dataset-20130324.zip"
sha256 = "8b5ce7e68fc1bccef88141fb148f160e26f1aba46712e953c9f6a53b7360cbaa"
file = "icdar2013/practice/eu-dataset-20130324.zip"

[source.icdar2013-practice-us]
url = "https://www.tamirhassan.com/html/files/us-gov-dataset-20130324.zip"
sha256 = "66a62f80acd59bcefb32df9f751516ae4edae7bfc23a1dd782055ec2015556bd"
file = "icdar2013/practice/us-gov-dataset-20130324.zip"

# micromamba builds Tesseract from conda-forge without root (docs/specs/15-heavy-competitors.md s. 0).
[source.micromamba]
url = "https://github.com/mamba-org/micromamba-releases/releases/download/2.3.2-0/micromamba-linux-64.tar.bz2"
sha256 = "5512233cdd8564a671626081026dc861537a963baa06706baab08fac6f3bb9d2"
file = "tools/micromamba-2.3.2-0-linux-64.tar.bz2"

[source.icdar2013-jar]
url = "https://www.tamirhassan.com/html/files/dataset-tools-20180206.jar"
sha256 = "0633721ba192f48ce90fae3b4d295997cfda324f1c7fa7e9e4b384c3f8919856"
file = "tools/dataset-tools-20180206.jar"

# Region mode (-reg) reads the PDF and needs these on the jar's classpath: JAI's PlanarImage (referenced
# while it logs page segments), and PDFBox 1.8.2's FontBox and Commons Collections 3 (not bundled).
[source.jai-core]
url = "https://download.java.net/media/jai/builds/release/1_1_3/jai-1_1_3-lib-linux-amd64.tar.gz"
sha256 = "4bf0d26acbedc9e203059b18f8a1a7bfef0b448cb5515b8c1b530706e68eb75a"
file = "tools/jai-1_1_3-lib-linux-amd64.tar.gz"

[source.fontbox]
url = "https://repo1.maven.org/maven2/org/apache/pdfbox/fontbox/1.8.2/fontbox-1.8.2.jar"
sha256 = "574a446becf773404ce99eb06a2ce96ce94fc9bd6e6987ddbfdc890f08b2dd2c"
file = "tools/fontbox-1.8.2.jar"

[source.commons-collections]
url = "https://repo1.maven.org/maven2/commons-collections/commons-collections/3.2.2/commons-collections-3.2.2.jar"
sha256 = "eeeae917917144a68a741d4c0dff66aa5c5c5fd85593ff217bced3fc8ca783b8"
file = "tools/commons-collections-3.2.2.jar"

# PDFBox 1.8.2 decrypts an encrypted PDF (the held-out tfex-usd, RC4) only with BouncyCastle, an
# optional dependency its pom names at 1.44.
[source.bcprov]
url = "https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk15/1.44/bcprov-jdk15-1.44.jar"
sha256 = "e678898aa6eda7d5f3ba0a260e60ec0245522f437c7ff25c365503f6514cac17"
file = "tools/bcprov-jdk15-1.44.jar"

[source.temurin-jre-17]
url = "https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.20.1%2B1/OpenJDK17U-jre_x64_linux_hotspot_17.0.20.1_1.tar.gz"
sha256 = "0b2b640e3046b64c8ec504de0ab9d91bb5610182bda21fad454681ce54d45a62"
file = "tools/OpenJDK17U-jre_x64_linux_hotspot_17.0.20.1_1.tar.gz"

[source.soric-icdar2013]
url = "https://huggingface.co/datasets/marijanic/table-extraction-scientific-datasets/resolve/db94734b3219404a2446ab305d8a7bbc97de2f86/icdar-2013.tar.gz"
sha256 = "fc58dd8ef5cd77f08b485aafe00b4809b7a5576f672386a7ed85ddc313f8ee8c"
file = "soric/icdar-2013.tar.gz"

[source.soric-predictions]
url = "https://huggingface.co/datasets/marijanic/table-extraction-scientific-datasets/resolve/db94734b3219404a2446ab305d8a7bbc97de2f86/experience-data/icdar-2013-predictions.tar.gz"
sha256 = "822d2ae19635ee5f0389328e44e37e94b0744a26b9a8858f4226f397c10da23c"
file = "soric/icdar-2013-predictions.tar.gz"

[source.olmocr-table-tests]
url = "https://huggingface.co/datasets/allenai/olmOCR-bench/resolve/54a96a6fb6a2bd3b297e59869491db4d3625b711/bench_data/table_tests.jsonl"
sha256 = "e37a99bd60de56c62cd3f4c1b7910b603641901c15ae119f849ffefa86cde120"
file = "olmocr/bench_data/table_tests.jsonl"

# The 188 table PDFs: bench/olmocr-tables.sha256 lists each one's SHA-256 and path under bench_data/.
[manifest.olmocr-tables]
url = "https://huggingface.co/datasets/allenai/olmOCR-bench/resolve/54a96a6fb6a2bd3b297e59869491db4d3625b711/bench_data/"
list = "olmocr-tables.sha256"
root = "olmocr/bench_data"

[scorer.soric]
repository = "https://github.com/soricm/table-extraction-benchmark"
tag = "v1.0.0"
commit = "48367ea2"
# Their evaluator on CPU (spec 12 section 0): Python 3.10, PyTorch's CPU wheels, and their pins.
python = "3.10"
index = "https://download.pytorch.org/whl/cpu"
with = [
    "torch==1.13.1+cpu", "torchvision==0.14.1+cpu", "numpy==1.24.2", "scipy==1.15.2",
    "tqdm==4.65.0", "apted==1.0.3", "beautifulsoup4==4.14.3", "lxml==5.3.1", "nltk==3.9.1",
    "pillow==11.1.0", "pymupdf==1.25.3", "table-recognition-metric==0.0.4", "levenshtein==0.27.1",
    "rapidfuzz==3.12.2", "editdistance==0.6.2", "matplotlib==3.9.4", "psutil==7.2.1",
    "pyyaml==6.0.3", "scikit-image==0.25.2", "pycocotools==2.0.11", "pandas==2.3.3",
]

[scorer.olmocr]
package = "olmocr[bench]==0.4.27"
# olmocr 0.4.27's bench imports numpy without declaring it.
with = ["numpy==2.3.3"]

# The OCR benchmarks' scorers (docs/specs/18-ocr-benchmarks.md section 4), each unmodified in an
# environment of its own, resolved as of the day they were pinned. OmniDocBench's evaluation code at
# its v1_0 branch, with the versions its requirements.txt names:
[scorer.omnidocbench]
repository = "https://github.com/opendatalab/OmniDocBench"
branch = "v1_0"
commit = "337cc26965893db3ef53ddc119a6d6bb5bde096f"
root = "omnidocbench/eval"
python = "3.10"
with = [
    "apted==1.0.3", "beautifulsoup4==4.11.1", "datasets==3.1.0", "evaluate==0.4.3",
    "func-timeout==4.3.5", "Levenshtein==0.25.1", "loguru==0.7.2", "lxml==4.9.1",
    "matplotlib==3.7.5", "mmeval==0.2.1", "numpy==1.24.4", "pandas==2.0.3", "pylatexenc==3.0a30",
    "PyYAML==6.0.2", "rapidfuzz==3.9.7", "scipy==1.10.1", "tabulate==0.9.0", "tqdm==4.67.1",
]
exclude-newer = "2026-10-08T00:00:00Z"

[scorer.parsebench]
package = "parse-bench==1.0.4"
python = "3.12"
exclude-newer = "2026-10-08T00:00:00Z"

# opendataloader-bench's evaluator ([ocr.dpbench]'s src/evaluator.py) with the packages it imports.
[scorer.opendataloader]
python = "3.13"
with = [
    "apted==1.0.3", "beautifulsoup4==4.14.3", "lxml==6.1.0", "rapidfuzz==3.14.3", "soupsieve==2.8.3",
]
exclude-newer = "2026-10-08T00:00:00Z"

# The OCR benchmarks' data (docs/specs/18-ocr-benchmarks.md sections 0 and 1). One fetched from
# Hugging Face lists every file it uses with its SHA-256 (`list`, under bench/; checked against the
# Hub's own hashes when pinned), fetched from `url` + path into `root` under the cache; DP-Bench is
# opendataloader-bench's repository, cloned at `revision`.
[ocr.olmocr]
revision = "54a96a6fb6a2bd3b297e59869491db4d3625b711"
url = "https://huggingface.co/datasets/allenai/olmOCR-bench/resolve/54a96a6fb6a2bd3b297e59869491db4d3625b711/bench_data/"
list = "ocr/olmocr.sha256"
root = "olmocr/bench_data"

[ocr.omnidocbench]
revision = "f5f559bddf50e36f7f9899d842d0006f13ce8afc"
url = "https://huggingface.co/datasets/opendatalab/OmniDocBench/resolve/f5f559bddf50e36f7f9899d842d0006f13ce8afc/"
list = "ocr/omnidocbench.sha256"
root = "omnidocbench/v1_0"

[ocr.parsebench]
revision = "2805a1d940f95a203e0ae4b88be9934f7765b3fc"
url = "https://huggingface.co/datasets/llamaindex/ParseBench/resolve/2805a1d940f95a203e0ae4b88be9934f7765b3fc/"
list = "ocr/parsebench.sha256"
root = "parsebench/data"

[ocr.dpbench]
revision = "7af1d8f4d0c09f51ea1a5c6ba5f66e993286d109"
repository = "https://github.com/opendataloader-project/opendataloader-bench"
root = "dpbench/opendataloader-bench"

# Upstage's own DP-Bench truth, from which opendataloader-bench's Markdown truth derives.
[ocr.dpbench-upstage]
revision = "24702c61a2fb13325534be664653bc6e60250d13"
url = "https://huggingface.co/datasets/upstage/dp-bench/resolve/24702c61a2fb13325534be664653bc6e60250d13/"
list = "ocr/dpbench-upstage.sha256"
root = "dpbench/upstage"

# Tesseract 5.5.3 for unstructured and the ablation, in a prefix under the cache (spec 15 section 1).
[tesseract]
channel = "conda-forge"
spec = "tesseract=5.5.3=h7618cdf_0"

[tool]
pdfplumber = "0.11.10"
pymupdf = "1.28.2"
camelot-py = "2.0.0"
# The heavy competitors (docs/specs/15-heavy-competitors.md section 1), with PyTorch's CPU build.
docling = "2.131.0"
marker-pdf = "2.0.0"
unstructured = "0.27.10"
torch-index = "https://download.pytorch.org/whl/cpu"
# Every heavy tool's dependencies as of this date, so a restarted process resolves the same.
exclude-newer = "2026-10-01T00:00:00Z"
# The text-layer converters of the OCR benchmarks (docs/specs/18-ocr-benchmarks.md section 3).
pymupdf4llm = "1.28.2"
markitdown = "0.1.8"
liteparse = "2.15.1"
text-layer-exclude-newer = "2026-10-08T00:00:00Z"
